# csbx policy: what the agent may reach. Nothing else. Edit, then: csbx reload
# Three kinds of lines, each can repeat. A host is exact; ".host" also
# covers every subdomain. A regex sees the whole URL, so escape the dots.
#
#   acl allowed dstdomain -n HOST ...     GET and HEAD, any path
#   acl post_ok url_regex REGEX ...       POST too, on matching URLs (host must be in allowed)
#   acl any_ok  dstdomain -n HOST ...     any method, any path

# Claude Code: the API, login and token refresh, the installer
acl any_ok  dstdomain -n api.anthropic.com
acl allowed dstdomain -n platform.claude.com claude.ai claude.com downloads.claude.ai
acl post_ok url_regex ^https://platform\.claude\.com/v1/oauth/token$

# git hosting: clone/fetch/pull work, push does not
acl allowed dstdomain -n gitlab.com github.com .githubusercontent.com
acl post_ok url_regex ^https://(gitlab\.com|github\.com)/.*/git-upload-pack$

# packages: apt, npm, node, pip
acl allowed dstdomain -n deb.debian.org security.debian.org registry.npmjs.org nodejs.org pypi.org files.pythonhosted.org
