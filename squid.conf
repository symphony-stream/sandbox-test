# csbx proxy. Squid runs inside the VM on 127.0.0.1:3128; the container
# reaches it through one Incus proxy socket and has no other network.
# What is allowed comes from policy.conf (acls allowed, post_ok, any_ok);
# this file only says how the rules apply. Rules are first-match; the
# last one refuses everything else. Edit, then on the Mac: csbx reload

http_port 127.0.0.1:3128 ssl-bump tls-cert=/etc/squid/ca.pem
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 4MB
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump bump all                  # every tunnel is opened and inspected

# policy.conf defines allowed, post_ok, any_ok (no comment allowed on an include line)
include /etc/squid/policy.conf
acl safe_ports port 443 80
acl tls        port 443
acl readonly   method GET HEAD
acl POST       method POST
acl push       url_regex service=git-receive-pack /git-receive-pack$
acl certfetch  transaction_initiator certificate-fetching

http_access deny  manager
http_access deny  !safe_ports
http_access deny  push                   # git push: refused at its first request
http_access allow certfetch              # Squid fetching a missing intermediate cert
http_access deny  !allowed !any_ok       # unlisted host: refused before any DNS lookup
http_access deny  to_localhost
http_access allow CONNECT tls allowed    # https to an allowed host (then bumped)
http_access allow allowed readonly       # GET/HEAD on an allowed host
http_access allow allowed POST post_ok   # the POST exceptions
http_access allow any_ok                 # any method
http_access deny  all

# Note: the container appears to Squid as 127.0.0.1. Never add an
# "http_access allow localhost" rule: it would allow everything.

cache deny all
via off
forwarded_for delete
tls_outgoing_options min-version=1.2
shutdown_lifetime 1 seconds
logfile_rotate 0
strip_query_terms off
logformat csbx %tl %Ss/%03>Hs %rm %ru sni=%ssl::>sni
access_log stdio:/var/log/squid/access.log logformat=csbx
error_directory /etc/squid/errors        # one-line 403 body, written in README step 2
