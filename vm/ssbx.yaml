# The ssbx VM. ssbx fills in the {{values}} from ssbx.toml and writes the
# result to ~/.lima/_templates/ssbx.yaml; edit ssbx.toml, not this file.
minimumLimaVersion: "2.0.0"
base:
- template:_images/{{image}}

vmType: {{vm_type}}
cpus: {{cpus}}
memory: {{memory}}
disk: {{disk}}

# Your folders, read-write, at the same paths as on your machine; ~/.claude
# too. /ssbx is the read-only share with the proxy's certificate and Claude
# Code's managed settings.
mountType: {{mount_type}}
mountInotify: false
mounts: {{mounts}}

containerd:
  system: false
  user: false

# Nothing the VM listens on is exposed on your machine.
portForwards:
- guestIP: "0.0.0.0"
  proto: any
  ignore: true
- guestIP: "127.0.0.1"
  proto: any
  ignore: true

# The only way out is the ssbx proxy on your machine.
propagateProxyEnv: false
env: {{env}}

user:
  home: {{home}}

param:
  ProxyPort: {{proxy_port}}
  Upstream: {{upstream}}
  Packages: {{packages}}
  User: {{user}}

provision:
- mode: system
  script: |
{{provision}}

probes:
- description: "ssbx provisioning to have finished"
  script: |
    #!/bin/bash
    set -eu -o pipefail
    if ! timeout 900s bash -c "until [ -e /run/ssbx.ready ]; do sleep 3; done"; then
      echo >&2 "ssbx provisioning did not finish; see /var/log/cloud-init-output.log in the VM"
      exit 1
    fi
  hint: |
    See "/var/log/cloud-init-output.log" in the guest.
