# ssbx: a Colima VM whose traffic is captured on your Mac by mitmproxy in
# local mode (see README). Nothing in the VM knows about the proxy; the VM
# only has to trust the proxy's CA, which the script below does.
#
#   mkdir -p ~/sandbox ~/.config/ssbx ~/.colima/ssbx
#   cp config.yaml ~/.config/ssbx/ && cp colima.yaml ~/.colima/ssbx/
#   mitmproxy --set confdir=~/.config/ssbx      # terminal 1
#   colima start ssbx                           # terminal 2

cpu: 4
memory: 3
disk: 60
runtime: incus
vmType: vz
mountType: virtiofs
network:
  address: false          # keep false: a reachable IP would bypass the proxy (vzNAT)
forwardAgent: false
sshConfig: false

mounts:
  - location: ~/sandbox   # your projects
    writable: true
  - location: ~/.claude   # Claude Code login, settings, skills
    writable: true

provision:
  # Trust the proxy's CA. http://mitm.it is answered by mitmproxy itself.
  - mode: system
    script: |
      until curl -sf http://mitm.it/cert/pem -o /usr/local/share/ca-certificates/ssbx.crt; do sleep 3; done
      update-ca-certificates >/dev/null
