# ssbx: a Colima VM with an Incus container inside, whose only way out is an
# allowlist proxy (plain mitmproxy, configured by ~/.config/ssbx/config.yaml).
# Every Colima setting is listed; the ones that matter for ssbx are commented.
#
#   mkdir -p ~/sandbox ~/.config/ssbx ~/.colima/ssbx
#   cp config.yaml ~/.config/ssbx/ && cp colima.yaml ~/.colima/ssbx/
#   colima start ssbx
#
# Linux: `colima start ssbx --vm-type qemu --mount-type 9p` (virtiofs is macOS only).

cpu: 4
disk: 60                     # GiB for containers and images; can only grow later
memory: 3                    # GiB for the VM; the container lives inside it
arch: host
runtime: incus               # the sandbox is an Incus container, not Docker
modelRunner: docker          # unused with incus, Colima's default
hostname: ""                 # default: colima-ssbx
kubernetes:
  enabled: false
autoActivate: true           # makes `incus` on your machine talk to this VM

network:
  address: false             # the VM needs no reachable IP
  mode: shared
  interface: en0
  preferredRoute: false
  dns: []
  dnsHosts: {}
  hostAddresses: false
  gatewayAddress: 192.168.5.2

forwardAgent: false          # never hand the sandbox your SSH agent
docker: {}
vmType: vz                   # Linux: qemu
portForwarder: ssh
rosetta: false               # no amd64 binaries in the sandbox
binfmt: false                # no foreign-architecture emulation needed
nestedVirtualization: false  # only needed for Incus VMs, we use a container
mountType: virtiofs          # Linux: 9p
mountInotify: false
cpuType: host
sshConfig: false             # do not write into ~/.ssh/config; `colima ssh ssbx` still works
sshPort: 0
diskImage: ""
forceDiskImage: false
rootDisk: 20
env: {}

# Folders the container sees, at the same paths as on your machine.
# ~/sandbox: your projects. ~/.claude: Claude Code login, settings, skills.
# ~/.config/ssbx: proxy config and log; stays in the VM, not in the container.
mounts:
  - location: ~/sandbox
    writable: true
  - location: ~/.claude
    writable: true
  - location: ~/.config/ssbx
    writable: true
# - location: ~/.codex
#   writable: true

provision:
  # As root, every start: the proxy service in the VM, and the uid mapping
  # Incus needs so that files in the container are owned by you.
  - mode: system
    script: |
      set -eu
      USER_UID=$(id -u "$(basename "$(ls -d /home/*.linux | head -1)" .linux)")
      CFG=$(findmnt -rn -o TARGET | grep '/\.config/ssbx$' | head -1)
      if [ ! -x /opt/mitm/bin/mitmdump ]; then
        DEBIAN_FRONTEND=noninteractive apt-get install -yq python3-venv
        python3 -m venv /opt/mitm && /opt/mitm/bin/pip install -q mitmproxy
      fi
      mkdir -p /var/lib/ssbx && ln -sfn "$CFG/config.yaml" /var/lib/ssbx/config.yaml
      # mitmdump does not reload its config, so the unit restarts it when the
      # file changes (stat -L follows the symlink; %% is a literal % for systemd).
      cat > /etc/systemd/system/ssbx-proxy.service <<UNIT
      [Service]
      ExecStart=/bin/sh -c '/opt/mitm/bin/mitmdump --set confdir=/var/lib/ssbx & p=\$!; m0=\$(stat -Lc %%Y /var/lib/ssbx/config.yaml 2>/dev/null||echo 0); while kill -0 \$p 2>/dev/null; do sleep 3; m1=\$(stat -Lc %%Y /var/lib/ssbx/config.yaml 2>/dev/null||echo 0); [ "\$m1" != "\$m0" ] && kill \$p; done; wait \$p'
      Restart=always
      RestartSec=3
      StartLimitIntervalSec=0
      StandardOutput=append:$CFG/proxy.log
      StandardError=append:$CFG/proxy.log
      [Install]
      WantedBy=multi-user.target
      UNIT
      systemctl daemon-reload && systemctl enable -q ssbx-proxy && systemctl restart ssbx-proxy
      for f in /etc/subuid /etc/subgid; do
        grep -q "^root:$USER_UID:1$" "$f" || echo "root:$USER_UID:1" >> "$f"
      done
      systemctl try-restart incus.service || true

  # Once Incus is up: the container profile, then the container itself
  # (created on the first start, just started afterwards).
  - mode: ready
    script: |
      set -eu
      USER_NAME=$(basename "$(ls -d /home/*.linux | head -1)" .linux)
      USER_UID=$(id -u "$USER_NAME")
      HOME_DIR=$(findmnt -rn -o TARGET | grep '/\.config/ssbx$' | head -1); HOME_DIR=${HOME_DIR%/.config/ssbx}
      P=http://127.0.0.1:8080
      for i in $(seq 60); do sudo -n incus info >/dev/null 2>&1 && break; sleep 2; done
      POOL=$(sudo -n incus storage list -f csv | head -1 | cut -d, -f1)
      sudo -n incus profile show ssbx >/dev/null 2>&1 || sudo -n incus profile create ssbx
      sudo -n incus profile edit ssbx <<EOF
      description: ssbx sandbox
      config:
        boot.autostart: "true"
        limits.memory: 2GiB
        raw.idmap: "both $USER_UID $USER_UID"
        environment.HTTP_PROXY: $P
        environment.HTTPS_PROXY: $P
        environment.http_proxy: $P
        environment.https_proxy: $P
      devices:
        root: {type: disk, path: /, pool: $POOL}
        # No network device at all: this proxy device is the only way out.
        proxy: {type: proxy, listen: tcp:127.0.0.1:8080, connect: tcp:127.0.0.1:8080, bind: instance}
        sandbox: {type: disk, source: $HOME_DIR/sandbox, path: $HOME_DIR/sandbox, shift: "true"}
        claude: {type: disk, source: $HOME_DIR/.claude, path: $HOME_DIR/.claude, shift: "true"}
      EOF
      if sudo -n incus info ssbx >/dev/null 2>&1; then sudo -n incus start ssbx 2>/dev/null || true; exit 0; fi
      sudo -n incus launch images:debian/13 ssbx -p ssbx
      sudo -n incus file push /var/lib/ssbx/mitmproxy-ca-cert.pem ssbx/usr/local/share/ca-certificates/ssbx.crt
      cat > /tmp/ssbx-setup.sh <<EOF
      set -eu
      update-ca-certificates >/dev/null
      printf 'Acquire::http::Proxy "$P";\nAcquire::https::Proxy "$P";\n' > /etc/apt/apt.conf.d/90ssbx
      apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -yq sudo git curl ca-certificates
      useradd -u $USER_UID -d $HOME_DIR -s /bin/bash $USER_NAME && chown $USER_UID:$USER_UID $HOME_DIR
      printf '$USER_NAME ALL=(ALL) NOPASSWD:ALL\nDefaults env_keep += "HTTP_PROXY HTTPS_PROXY http_proxy https_proxy"\n' > /etc/sudoers.d/ssbx
      printf 'export HTTP_PROXY=$P HTTPS_PROXY=$P http_proxy=$P https_proxy=$P\n' > /etc/profile.d/ssbx.sh
      EOF
      sudo -n incus file push /tmp/ssbx-setup.sh ssbx/root/ssbx-setup.sh
      sudo -n incus exec ssbx -- sh /root/ssbx-setup.sh
