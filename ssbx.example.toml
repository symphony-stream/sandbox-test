# ssbx configuration. ssbx copies this file to ~/.lima/_config/ssbx.toml on
# the first run; edit it there, at mode 600 (it holds your tokens). The
# proxy restarts on its own when [hosts] changes; cpus, memory, disk,
# mounts and packages take effect after `ssbx stop`.

# The folders of your machine the VM can see, read-write. The project you
# start ssbx in has to be inside one of them. ~/.claude is always shared, so
# Claude inside is Claude outside: same login, settings, sessions, history.
mounts = ["~/Work"]

cpus = 4
memory = 8         # GiB
disk = 60          # GiB
# "bypassPermissions", "auto", "acceptEdits", "default", or empty for the
# same as on your machine.
permission_mode = "bypassPermissions"

#env = { ANTHROPIC_MODEL = "claude-opus-5-5" }      # extra env vars for the sandbox
#packages = ["build-essential", "golang"]            # extra Debian packages
#proxy = "http://user:pass@proxy.example.com:3128"   # an upstream proxy for the sandbox's traffic
# "all" logs every tool call and prompt, "blocked" only refusals and
# failures (the proxy's own refusals are always logged). See `ssbx logs`.
log = "all"
#log_file = "~/.lima/_config/ssbx/audit.jsonl"
#proxy_port = 17080   # the port the proxy listens on, on your machine only
# ------------------------------------------------------------- hosts
# Where the sandbox may go; everything else is refused. `ssbx logs blocked`
# shows why and prints a snippet you can paste here.
#
#   [hosts."name"]               an exact host, or "*.name" for subdomains
#   allow = "METHODS [PATH]"     one entry, or a list of them
#   kind = "github"              optional: the proxy adds this token
#   token = "..."                github, gitlab, atlassian (email:api-token), bearer
#   mutations = ["addComment"]   optional: GraphQL mutations allowed by name
#
# METHODS: GET (with HEAD), POST, PUT, PATCH, DELETE, OPTIONS, git-fetch,
# git-push, graphql (queries only), or * for everything. PATH: * is one
# segment, ** any number, no PATH means every path, matched fully
# percent-decoded. Entries only allow: a request passes if one fits.
#
# `allow = "*"` with no token is a plain tunnel: the proxy sees only the
# CONNECT host and the TLS SNI. Everything else is intercepted with the
# proxy's certificate, so it can check the method and path.

# Claude Code itself: plain tunnels
hosts."api.anthropic.com".allow = "*"
hosts."statsig.anthropic.com".allow = "*"
hosts."claude.ai".allow = "*"
hosts."platform.claude.com".allow = "*"

# Packages: download only
hosts."registry.npmjs.org".allow = "GET"
hosts."pypi.org".allow = "GET"
hosts."files.pythonhosted.org".allow = "GET"
hosts."deb.debian.org".allow = "GET"
hosts."security.debian.org".allow = "GET"

# GitHub: read and clone everything, push to one repository, comment.
#[hosts."github.com"]
#kind = "github"
#token = "github_pat_xxxxxxxxxxxxxxxx"
#allow = ["GET,git-fetch", "git-push /me/scratch"]
#hosts."*.githubusercontent.com".allow = "GET"
#[hosts."api.github.com"]
#kind = "github"
#token = "github_pat_xxxxxxxxxxxxxxxx"
#allow = ["GET,graphql", "POST /repos/*/*/issues/*/comments"]
#mutations = ["addComment"]

# GitLab: read and clone, comment on merge requests
#[hosts."gitlab.example.com"]
#kind = "gitlab"
#token = "glpat-xxxxxxxxxxxxxxxxxxxx"
#allow = ["GET,git-fetch", "graphql /api/graphql", "POST /api/v4/projects/*/merge_requests/*/notes"]

# Confluence and Jira Cloud: read everything, write comments, search
#[hosts."example.atlassian.net"]
#kind = "atlassian"
#token = "you@example.com:ATATT3xxxxxxxxxxxx"
#allow = ["GET", "POST /wiki/api/v2/footer-comments", "POST /rest/api/3/search/jql"]
